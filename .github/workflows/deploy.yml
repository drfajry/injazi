name: Deploy Injazi Web

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: "3.47.0"
      channel: stable
      cache: true

  - name: Get dependencies
    working-directory: injazi-flutter
    run: flutter pub get

  - name: Analyze
    working-directory: injazi-flutter
    run: flutter analyze

  - name: Build Web
    working-directory: injazi-flutter
    run: flutter build web --release --base-href "/injazi/"

  - name: Setup Pages
    uses: actions/configure-pages@v5

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: injazi-flutter/build/web
```

deploy:
needs: build
runs-on: ubuntu-latest

```
environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:
  - name: Deploy
    id: deployment
    uses: actions/deploy-pages@v4
```

